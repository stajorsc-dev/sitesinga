<script>
const ERRORS=[
  {code:'E5',dev:'Кофемашина',mean:'Ошибка датчика температуры или перегрев',fix:'Дайте остыть, проверьте уровень воды. Если повторяется — нужна замена термодатчика. Ремонт от 1 500 ₽.'},
  {code:'E8',dev:'Кофемашина',mean:'Проблема с контуром воды или помпой',fix:'Проверьте бак и фильтр. Часто — накипь или неисправная помпа. Декальцинация или ремонт от 2 000 ₽.'},
  {code:'4013',dev:'iPhone',mean:'Ошибка восстановления iTunes — проблема связи/железа',fix:'Часто связана с модемом или памятью. Нужна аппаратная диагностика. Бесплатно при ремонте.'},
  {code:'4005',dev:'iPhone',mean:'Сбой при обновлении прошивки',fix:'Может быть кабель или разъём. Принесите — проверим разъём и попробуем восстановить. От 1 200 ₽.'},
  {code:'9',dev:'iPhone',mean:'Ошибка 9 в iTunes — разрыв связи при прошивке',fix:'Часто проблема с памятью NAND или модемом. Нужна диагностика под микроскопом.'},
  {code:'0xc000000e',dev:'Ноутбук Windows',mean:'Не найдено загрузочное устройство',fix:'Проблема с диском или загрузчиком. Часто — отошёл SSD или сбой системы. От 1 000 ₽.'},
  {code:'0xc0000225',dev:'Ноутбук Windows',mean:'Повреждён загрузчик Windows',fix:'Восстановление загрузчика или переустановка. Данные сохраняем. От 1 500 ₽.'},
  {code:'no bootable device',dev:'Ноутбук',mean:'Система не видит жёсткий диск',fix:'Часто умер HDD/SSD или отошёл шлейф. Диагностика, замена диска. От 1 000 ₽ + диск.'},
  {code:'F1/F2',dev:'Кофемашина DeLonghi',mean:'Ошибка заварного блока',fix:'Блок заклинило или загрязнён. Чистка или ремонт механизма. От 1 500 ₽.'},
];
function render(list){
  document.getElementById('errResults').innerHTML=list.length?list.map(e=>`
  <div style="background:#fff;border:1.5px solid #dde8f8;border-radius:16px;padding:18px;margin-bottom:10px">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
      <span style="background:#5b4af0;color:#fff;font-family:monospace;font-weight:700;padding:4px 12px;border-radius:8px">${e.code}</span>
      <span style="font-size:12px;color:#8a9bb5;font-weight:700">${e.dev}</span>
    </div>
    <b style="font-size:15px;display:block;margin-bottom:6px">${e.mean}</b>
    <p style="font-size:14px;color:var(--ink-soft);line-height:1.6">${e.fix}</p>
  </div>`).join('')+`<div style="text-align:center;margin-top:16px"><a class="btn btn--primary" href="zapis.html">Записаться на ремонт</a></div>`:'<p style="text-align:center;color:#8a9bb5;padding:30px">Код не найден. Напишите в <a href="https://t.me/+79281618789" style="color:#5b4af0">Telegram</a> — расшифруем.</p>';
}
function searchErr(q){
  q=q.toLowerCase().trim();
  if(!q){render(ERRORS);return;}
  render(ERRORS.filter(e=>(e.code+' '+e.dev+' '+e.mean).toLowerCase().includes(q)));
}
render(ERRORS);
</script>

<script>

  document.querySelectorAll('.menu a').forEach(function(a){

<script>
(function(){
  var bar = document.getElementById('scrollProgress');
  if(!bar) return;
  function update(){
    var h = document.documentElement;
    var scrollable = h.scrollHeight - h.clientHeight;
    var pct = scrollable > 0 ? (h.scrollTop / scrollable) * 100 : 0;
    bar.style.width = pct + '%';
  }
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  update();
})();
</script>
