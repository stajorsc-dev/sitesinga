<script>
const ITEMS=[
  {t:'Сделайте резервную копию данных',d:'iCloud/Google или на компьютер — на случай если данные затронет ремонт'},
  {t:'Запишите пароли и важную информацию',d:'Чтобы быстро восстановить доступ после ремонта'},
  {t:'Выйдите из Find My iPhone / Найти устройство',d:'Иначе мастер не сможет проверить работу после ремонта'},
  {t:'Снимите блокировку экрана или сообщите код',d:'Мастеру нужен доступ для тестирования (код в безопасности)'},
  {t:'Достаньте SIM и карту памяти',d:'Чтобы не потерялись во время ремонта'},
  {t:'Снимите чехол и плёнку',d:'Если планируется замена экрана или стекла'},
];
function render(){
  const saved=JSON.parse(localStorage.getItem('checklist')||'[]');
  document.getElementById('clList').innerHTML=ITEMS.map((it,i)=>`
  <label style="display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #f0f4fb;cursor:pointer;align-items:flex-start">
    <input type="checkbox" ${saved.includes(i)?'checked':''} onchange="toggle(${i})" style="width:22px;height:22px;margin-top:2px;accent-color:#1a5eff;flex-shrink:0">
    <div><b style="font-size:15px;${saved.includes(i)?'text-decoration:line-through;opacity:.5':''}">${it.t}</b><p style="font-size:13px;color:var(--ink-soft);margin-top:2px">${it.d}</p></div>
  </label>`).join('');
  const pct=saved.length/ITEMS.length*100;
  document.getElementById('clProg').style.width=pct+'%';
  document.getElementById('clDone').style.display=saved.length===ITEMS.length?'block':'none';
}
function toggle(i){
  let saved=JSON.parse(localStorage.getItem('checklist')||'[]');
  if(saved.includes(i))saved=saved.filter(x=>x!==i);else saved.push(i);
  localStorage.setItem('checklist',JSON.stringify(saved));
  render();
}
render();
</script>
