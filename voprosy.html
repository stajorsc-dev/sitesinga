<script>
const FAQ=[
  {q:'Сколько стоит диагностика?',a:'Диагностика бесплатна при последующем ремонте. Без ремонта — от 500 ₽.',cat:'Цены'},
  {q:'Какая гарантия на ремонт?',a:'Гарантия на работы и запчасти — от 30 дней, на некоторые работы до 6 месяцев. Выдаём гарантийный талон.',cat:'Гарантия'},
  {q:'Сколько времени занимает ремонт?',a:'Простые работы (экран, аккумулятор) — 1-3 часа. Сложные — 1-5 дней. Срочный ремонт возможен.',cat:'Сроки'},
  {q:'Используете оригинальные запчасти?',a:'Работаем с оригинальными и качественными совместимыми. Выбор обсуждаем при согласовании цены.',cat:'Запчасти'},
  {q:'Сохранятся ли мои данные?',a:'При большинстве ремонтов данные не затрагиваются. Рекомендуем сделать бэкап на всякий случай.',cat:'Данные'},
  {q:'Можно ли вызвать мастера на дом?',a:'Да, выезд возможен для крупной техники (ТВ, стиралки). Телефоны и ноутбуки — в сервис.',cat:'Выезд'},
  {q:'Как узнать стоимость заранее?',a:'Используйте калькулятор на сайте, AI-диагностику или напишите модель в Telegram — назовём примерную цену.',cat:'Цены'},
  {q:'Что если ремонт не помог?',a:'Если проблема в рамках выполненных работ вернётся в гарантийный срок — исправим бесплатно.',cat:'Гарантия'},
  {q:'Работаете с юрлицами?',a:'Да, заключаем договоры, выдаём закрывающие документы. Есть корпоративные тарифы.',cat:'Бизнес'},
  {q:'Где вас найти?',a:'8 точек по Ростову-на-Дону: Заводская 25 (цех), Ткачева, Стачки, Еременко, Жданова + 3 пункта Ozon.',cat:'Адреса'},
  {q:'Можно ли оплатить картой?',a:'Да, принимаем наличные и карты. Для юрлиц — безнал по счёту.',cat:'Оплата'},
  {q:'Ремонтируете технику после воды?',a:'Да, это частый случай. Чем быстрее принесёте и чем меньше включаете — тем выше шанс спасти.',cat:'Ремонт'},
];
function render(list){
  document.getElementById('faqResults').innerHTML=list.length?list.map((f,i)=>`
  <details style="background:#fff;border:1.5px solid #dde8f8;border-radius:14px;padding:0;margin-bottom:8px">
    <summary style="padding:16px 18px;font-weight:700;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center">${f.q}<span style="color:#5b4af0">+</span></summary>
    <div style="padding:0 18px 16px;font-size:14px;color:var(--ink-soft);line-height:1.6">${f.a}<div style="margin-top:8px"><span style="font-size:11px;background:#f0f5ff;color:#5b4af0;padding:2px 10px;border-radius:99px;font-weight:700">${f.cat}</span></div></div>
  </details>`).join(''):'<p style="text-align:center;color:#8a9bb5;padding:30px">Ничего не найдено. Спросите в <a href="https://t.me/+79281618789" style="color:#5b4af0">Telegram</a>.</p>';
}
function searchFaq(q){
  q=q.toLowerCase().trim();
  if(!q){render(FAQ);return;}
  render(FAQ.filter(f=>(f.q+' '+f.a+' '+f.cat).toLowerCase().includes(q)));
}
render(FAQ);
</script>

<script>
(function(){
  var bar = document.getElementById('scrollProgress');
  if(!bar) return;
  function update(){
    var h = document.documentElement;
    var scrollable = h.scrollHeight - h.clientHeight;
    var pct = scrollable > 0 ? (h.scrollTop / scrollable) * 100 : 0;
    bar.style.width = pct + '%';
  }
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  update();
})();
