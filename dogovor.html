<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <title>Договор на оказание услуг — Синга Сервис</title>
  <meta name="description" content="Образец договора на оказание услуг сервисного центра «Синга Сервис» в Ростове-на-Дону.">
  <meta http-equiv="refresh" content="0; url=documents/contract.html">
  <link rel="canonical" href="documents/contract.html">
  <meta name="robots" content="noindex,follow">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center;padding:60px 20px;color:#0b1830;background:#f4f7fc}
    a{color:#5b4af0;font-weight:700;text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
</head>
<body><div id="scrollProgress"></div>
  <h1 style="font-size:22px;font-weight:800">Открываем договор…</h1>
  <p>Если перенаправление не произошло автоматически:</p>
  <p><a href="documents/contract.html">Перейти к образцу договора</a></p>
  <script>location.replace('documents/contract.html');</script>
<style>.reveal{opacity:1!important;transform:none!important}.reveal.is-animating{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s}.reveal.is-animating.is-visible{opacity:1!important;transform:none!important}</style>
<script src="assets/search-index.js" defer></script>
<script src="assets/site-search.js" defer></script>
<script>
(function(){
  var path = (location.pathname.split('/').pop() || 'index.html');
  document.querySelectorAll('.menu a').forEach(function(a){
    var href = (a.getAttribute('href')||'').split('#')[0] || 'index.html';
    if(href === path && href !== 'index.html'){ a.classList.add('is-current'); a.setAttribute('aria-current','page'); }
  });
})();
</script>
<script>
(function(){
  var bar = document.getElementById('scrollProgress');
  if(!bar) return;
  function update(){
    var h = document.documentElement;
    var scrollable = h.scrollHeight - h.clientHeight;
    var pct = scrollable > 0 ? (h.scrollTop / scrollable) * 100 : 0;
    bar.style.width = pct + '%';
  }
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  update();
})();
</script>
</body>
</html>
