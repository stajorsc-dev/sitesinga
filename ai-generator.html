<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Генератор SEO-страниц — Синга Сервис</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css?v=20">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Onest:wght@700;800;900&display=swap" rel="stylesheet">
<style>
.gen-wrap{max-width:900px;margin:0 auto}
.gen-field{width:100%;padding:12px 16px;border:1.5px solid #dde8f8;border-radius:12px;font-size:15px;font-family:inherit;outline:none;margin-bottom:10px}
.gen-field:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,94,255,.10)}
.gen-output{background:#f5f8ff;border:1.5px solid #dde8f8;border-radius:16px;padding:20px;margin-top:20px;display:none;min-height:200px;font-size:14px;line-height:1.6;white-space:pre-wrap;font-family:monospace;max-height:500px;overflow-y:auto}
.gen-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.loader-gen{display:none;text-align:center;padding:24px;color:var(--ink-soft)}
.spinner-sm{width:28px;height:28px;border:3px solid #dde8f8;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.preset-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.preset-chip{background:#fff;border:1.5px solid #dde8f8;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;transition:all .15s}
.preset-chip:hover{border-color:var(--brand);color:var(--brand)}
</style>
</head>
<body class="premium-v5 design-v6" style="background:#f5f8ff;min-height:100vh">
<section style="padding:32px 20px 60px"><div class="container">
  <div class="gen-wrap">
    <div class="section-head" style="margin-bottom:28px">
      <span class="eyebrow">🤖 Внутренний инструмент · Claude AI</span>
      <h1 class="section-title">AI Генератор SEO-страниц</h1>
      <p style="color:var(--ink-soft);margin-top:8px">Вводите бренд или модель — получите готовый SEO-текст для страницы ремонта. Экономит часы ручной работы.</p>
    </div>

    <label style="font-size:13px;font-weight:700;display:block;margin-bottom:8px">Быстрые пресеты:</label>
    <div class="preset-chips">
      <button class="preset-chip" onclick="setPreset('Xiaomi Redmi Note 14 Pro')">Redmi Note 14 Pro</button>
      <button class="preset-chip" onclick="setPreset('Samsung Galaxy S24 Ultra')">Galaxy S24 Ultra</button>
      <button class="preset-chip" onclick="setPreset('iPhone 16 Pro Max')">iPhone 16 Pro Max</button>
      <button class="preset-chip" onclick="setPreset('MacBook Air M3')">MacBook Air M3</button>
      <button class="preset-chip" onclick="setPreset('DeLonghi Magnifica Evo')">DeLonghi Magnifica Evo</button>
      <button class="preset-chip" onclick="setPreset('Dyson V15 Detect')">Dyson V15</button>
      <button class="preset-chip" onclick="setPreset('ASUS ROG Zephyrus G14')">ROG Zephyrus G14</button>
      <button class="preset-chip" onclick="setPreset('Roborock S8 Pro Ultra')">Roborock S8</button>
    </div>

    <label style="font-size:13px;font-weight:700;display:block;margin-bottom:8px">Модель или устройство:</label>
    <input class="gen-field" id="genDevice" placeholder="Например: Xiaomi Redmi Note 13 Pro" value="">

    <label style="font-size:13px;font-weight:700;display:block;margin-bottom:8px">Тип контента:</label>
    <select class="gen-field" id="genType">
      <option value="repair_page">SEO-страница ремонта</option>
      <option value="faq">FAQ раздел (5 вопросов)</option>
      <option value="blog_post">Статья в блог</option>
      <option value="meta">Title + Description + H1</option>
      <option value="prices">Таблица цен на ремонт</option>
    </select>

    <button class="btn btn--primary btn--lg" onclick="generate()" id="genBtn" style="width:100%;justify-content:center">
      ✨ Сгенерировать
    </button>

    <div class="loader-gen" id="genLoader">
      <span class="spinner-sm"></span>Claude генерирует контент...
    </div>

    <div class="gen-output" id="genOutput"></div>

    <div class="gen-actions" id="genActions" style="display:none">
      <button class="btn btn--primary" onclick="copyOutput()">📋 Скопировать</button>
      <button class="btn btn--ghost" onclick="downloadOutput()">⬇️ Скачать .txt</button>
      <button class="btn btn--ghost" onclick="clearOutput()">↺ Сгенерировать заново</button>
    </div>

    <p style="font-size:13px;color:var(--ink-soft);margin-top:16px;text-align:center">
      Контент генерируется на основе реальных данных Синга Сервис. Проверяйте цены перед публикацией.
    </p>
  </div>
</div></section>

<script>
function setPreset(val) { document.getElementById('genDevice').value = val; }

const PROMPTS = {
  repair_page: (device) => `Напиши SEO-оптимизированный контент для страницы ремонта ${device} в Ростове-на-Дону для сервисного центра "Синга Сервис".

Включи:
1. Вводный абзац (150-200 слов) с ключевыми словами "ремонт ${device} Ростов-на-Дону", "цена", "гарантия"
2. Таблицу цен (5-7 видов работ с ценами)
3. Раздел "Частые неисправности" (4-5 пунктов)
4. Раздел "Почему нам доверяют" (3 пункта)
5. Заключительный абзац с призывом к действию

Стиль: профессиональный, но дружелюбный. Цены реалистичные для Ростова-на-Дону.
Упоминай: бесплатная диагностика при ремонте, 8 точек приёма, гарантия, цена до начала работ.`,

  faq: (device) => `Создай FAQ раздел из 5 вопросов и ответов для страницы ремонта ${device} в Ростове-на-Дону (Синга Сервис).

Включи вопросы о:
- Стоимости ремонта (конкретные цифры)
- Сроках
- Гарантии
- Оригинальных vs совместимых запчастях
- Как сдать технику (8 точек, Ozon)

Ответы короткие, информативные, 2-4 предложения.`,

  blog_post: (device) => `Напиши SEO-статью для блога: "Как ухаживать за ${device}: советы мастеров Синга Сервис"

Структура:
- Вводный абзац
- 4-5 советов по уходу
- Раздел "Когда нужен ремонт"
- Заключение с CTA

Длина: 400-600 слов. Тон: экспертный, полезный.`,

  meta: (device) => `Создай SEO-метаданные для страницы "Ремонт ${device} в Ростове-на-Дону":

1. Title (до 60 символов)
2. Description (до 160 символов)  
3. H1 заголовок
4. 5 LSI ключевых слов

Формат: четко разделённые блоки.`,

  prices: (device) => `Создай таблицу цен на ремонт ${device} для Ростова-на-Дону (Синга Сервис):

10-12 видов работ с:
- Названием работы
- Ориентировочной ценой в ₽ (реалистичной)
- Ориентировочным сроком

Формат: | Работа | Цена | Срок |`
};

async function generate() {
  const device = document.getElementById('genDevice').value.trim();
  const type = document.getElementById('genType').value;
  if (!device) { alert('Введите название устройства'); return; }

  document.getElementById('genBtn').disabled = true;
  document.getElementById('genLoader').style.display = 'block';
  document.getElementById('genOutput').style.display = 'none';
  document.getElementById('genActions').style.display = 'none';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        messages: [{role: 'user', content: PROMPTS[type](device)}]
      })
    });

    const data = await response.json();
    const text = data.content?.[0]?.text || 'Ошибка генерации';

    document.getElementById('genLoader').style.display = 'none';
    document.getElementById('genOutput').style.display = 'block';
    document.getElementById('genOutput').textContent = text;
    document.getElementById('genActions').style.display = 'flex';

  } catch(e) {
    document.getElementById('genLoader').style.display = 'none';
    document.getElementById('genOutput').style.display = 'block';
    document.getElementById('genOutput').textContent = 'Ошибка: ' + e.message;
  }

  document.getElementById('genBtn').disabled = false;
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('genOutput').textContent)
    .then(() => alert('Скопировано!'));
}

function downloadOutput() {
  const text = document.getElementById('genOutput').textContent;
  const device = document.getElementById('genDevice').value.replace(/\s+/g,'-').toLowerCase();
  const a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
  a.download = `seo-${device}.txt`;
  a.click();
}

function clearOutput() {
  document.getElementById('genOutput').style.display = 'none';
  document.getElementById('genActions').style.display = 'none';
}
</script>
</body>
</html>
