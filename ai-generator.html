<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png"><meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Генератор SEO-страниц — Синга Сервис</title>
<meta name="robots" content="noindex">
<style>
/* Критические стили — работают без загрузки styles.css */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:16px;line-height:1.6;color:#1a2540;background:#fff;margin:0;-webkit-font-smoothing:antialiased}
.container{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
.section{padding:56px 0}
.section--soft{background:#f5f8ff}
.reveal{opacity:1 !important;transform:none !important}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;border:2px solid transparent;transition:all .18s;font-family:inherit}
.btn--primary{background:#5b4af0;color:#fff}
.btn--tg{background:#2aabee;color:#fff}
.btn--call{background:#1aa05c;color:#fff}
.btn--ghost{background:#fff;color:#1a2540;border-color:#dde8f8}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.breadcrumb-nav{background:#f5f8ff;border-bottom:1px solid #dde8f8;padding:10px 0}
.breadcrumb{display:flex;align-items:center;gap:6px;list-style:none;font-size:13px;color:#8a9bb5}
.breadcrumb li:not(:last-child)::after{content:'›';margin-left:6px;opacity:.4}
.breadcrumb a{color:#5b4af0;text-decoration:none}
.section-title{font-size:clamp(28px,4vw,48px);font-weight:900;font-family:'Onest','Plus Jakarta Sans',sans-serif;letter-spacing:-.04em;line-height:1.05;color:#07152e;margin:0 0 14px}
.section-head--center{text-align:center}
.section-lead{font-size:18px;color:#556070;line-height:1.65;margin:0 0 32px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#5b4af0;background:#eff3ff;padding:5px 14px;border-radius:99px;margin-bottom:12px}
.page-with-sidebar{display:grid;grid-template-columns:1fr 280px;gap:40px;align-items:start}
.sticky-cta-sidebar{position:sticky;top:88px;background:#fff;border:1.5px solid #dde8f8;border-radius:24px;padding:24px 20px}
.sticky-cta-sidebar h4{font-size:17px;font-weight:900;margin-bottom:6px}
.sticky-cta-sidebar p{font-size:13px;color:#556070;margin-bottom:16px}
.sticky-cta-sidebar .btn{width:100%;justify-content:center;margin-bottom:8px}
.sticky-cta-sidebar__price{text-align:center;font-size:22px;font-weight:900;color:#5b4af0;font-family:'Onest',sans-serif;margin:12px 0 4px}
.sticky-cta-sidebar__note{text-align:center;font-size:12px;color:#8a9bb5}
.sticky-cta-sidebar__divider{border:none;border-top:1px solid #dde8f8;margin:14px 0}
.model-prices{background:#fff;border:1.5px solid #dde8f8;border-radius:20px;overflow:hidden}
.model-prices__head{background:linear-gradient(135deg,#f0f5ff,#e8f0ff);padding:14px 20px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.model-prices__row{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid #f0f4fb;font-size:14px;gap:12px}
.model-prices__name{font-weight:700;flex:1}
.model-prices__price{font-weight:900;color:#5b4af0;font-family:'Onest',sans-serif;white-space:nowrap}
.model-prices__time{font-size:12px;color:#8a9bb5;white-space:nowrap}
.faq-list{display:flex;flex-direction:column;gap:0}
.faq-item{border-bottom:1px solid #f0f4fb}
.faq-item:first-child{border-top:1px solid #f0f4fb}
.faq-q{width:100%;background:none;border:none;padding:16px 0;font-size:16px;font-weight:700;color:#1a2540;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;font-family:inherit}
.faq-q__ico{flex-shrink:0;width:24px;height:24px}
.faq-q__ico svg{stroke:currentColor;fill:none;stroke-width:2}
.faq-a{display:none;padding-bottom:16px;font-size:15px;color:#556070;line-height:1.7}
.faq-item.is-open .faq-a{display:block}
.promo-banner{background:linear-gradient(135deg,#07152e,#102260,#091840);border-radius:24px;padding:40px;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap}
.promo-banner__content{flex:1;min-width:280px}
.promo-banner h2{font-size:clamp(22px,3vw,32px);font-weight:900;color:#fff;margin:0 0 10px}
.promo-banner p{color:rgba(255,255,255,.65);margin:0 0 20px;font-size:16px;line-height:1.6}
.promo-banner__badge{display:inline-block;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);padding:5px 14px;border-radius:99px;font-size:12px;font-weight:800;margin-bottom:14px}
.promo-banner__actions{display:flex;gap:12px;flex-wrap:wrap}
.promo-banner__cta{background:#5b4af0;color:#fff;padding:13px 24px;border-radius:14px;font-weight:800;font-size:15px;text-decoration:none;display:inline-block}
.promo-banner__ghost{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);padding:13px 24px;border-radius:14px;font-weight:800;font-size:15px;text-decoration:none;display:inline-block}
.promo-banner__num{font-size:clamp(40px,6vw,72px);font-weight:900;font-family:'Onest',sans-serif;color:rgba(255,255,255,.12);line-height:1;text-align:right}
.promo-banner__num b{color:#fff;display:block}
.promo-banner__num span{font-size:14px;color:rgba(255,255,255,.45);font-weight:600}
.back-to-top{position:fixed;bottom:88px;right:24px;z-index:800;width:46px;height:46px;border-radius:50%;background:#fff;border:1.5px solid #dde8f8;font-size:18px;color:#5b4af0;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.back-to-top.is-visible{opacity:1;pointer-events:auto}
.m-sticky-bar{display:none}
.read-progress{position:fixed;top:0;left:0;z-index:9999;height:3px;width:0%;background:linear-gradient(90deg,#5b4af0,#00b894)}
.footer{background:#07152e;padding:40px 0 24px}
@media(max-width:900px){.page-with-sidebar{grid-template-columns:1fr}.sticky-cta-sidebar{position:static}}
@media(max-width:600px){.m-sticky-bar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:900;background:#fff;border-top:1px solid #dde8f8;padding:10px 12px;gap:8px}.m-sticky-bar .btn{flex:1;justify-content:center;font-size:13px;padding:10px 8px}}
</style>
<link rel="stylesheet" href="styles.css?v=20">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Onest:wght@700;800;900&display=swap" rel="stylesheet">
<style>
.gen-wrap{max-width:900px;margin:0 auto}
.gen-field{width:100%;padding:12px 16px;border:1.5px solid #dde8f8;border-radius:12px;font-size:15px;font-family:inherit;outline:none;margin-bottom:10px}
.gen-field:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,74,240,.10)}
.gen-output{background:#f5f8ff;border:1.5px solid #dde8f8;border-radius:16px;padding:20px;margin-top:20px;display:none;min-height:200px;font-size:14px;line-height:1.6;white-space:pre-wrap;font-family:monospace;max-height:500px;overflow-y:auto}
.gen-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.loader-gen{display:none;text-align:center;padding:24px;color:var(--ink-soft)}
.spinner-sm{width:28px;height:28px;border:3px solid #dde8f8;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.preset-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.preset-chip{background:#fff;border:1.5px solid #dde8f8;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;transition:all .15s}
.preset-chip:hover{border-color:var(--brand);color:var(--brand)}
</style>
</head>
<body class="premium-v5 design-v6" style="background:#f5f8ff;min-height:100vh"><div id="scrollProgress"></div>
<section style="padding:32px 20px 60px"><div class="container">
  <div class="gen-wrap">
    <div class="section-head" style="margin-bottom:28px">
      <span class="eyebrow">🤖 Внутренний инструмент · Claude AI</span>
      <h1 class="section-title">AI Генератор SEO-страниц</h1>
      <p style="color:var(--ink-soft);margin-top:8px">Вводите бренд или модель — получите готовый SEO-текст для страницы ремонта. Экономит часы ручной работы.</p>
    </div>

    <label style="font-size:13px;font-weight:700;display:block;margin-bottom:8px">Быстрые пресеты:</label>
    <div class="preset-chips">
      <button class="preset-chip" onclick="setPreset('Xiaomi Redmi Note 14 Pro')">Redmi Note 14 Pro</button>
      <button class="preset-chip" onclick="setPreset('Samsung Galaxy S24 Ultra')">Galaxy S24 Ultra</button>
      <button class="preset-chip" onclick="setPreset('iPhone 16 Pro Max')">iPhone 16 Pro Max</button>
      <button class="preset-chip" onclick="setPreset('MacBook Air M3')">MacBook Air M3</button>
      <button class="preset-chip" onclick="setPreset('DeLonghi Magnifica Evo')">DeLonghi Magnifica Evo</button>
      <button class="preset-chip" onclick="setPreset('Dyson V15 Detect')">Dyson V15</button>
      <button class="preset-chip" onclick="setPreset('ASUS ROG Zephyrus G14')">ROG Zephyrus G14</button>
      <button class="preset-chip" onclick="setPreset('Roborock S8 Pro Ultra')">Roborock S8</button>
    </div>

    <label style="font-size:13px;font-weight:700;display:block;margin-bottom:8px">Модель или устройство:</label>
    <input class="gen-field" id="genDevice" placeholder="Например: Xiaomi Redmi Note 13 Pro" value="">

    <label style="font-size:13px;font-weight:700;display:block;margin-bottom:8px">Тип контента:</label>
    <select class="gen-field" id="genType">
      <option value="repair_page">SEO-страница ремонта</option>
      <option value="faq">FAQ раздел (5 вопросов)</option>
      <option value="blog_post">Статья в блог</option>
      <option value="meta">Title + Description + H1</option>
      <option value="prices">Таблица цен на ремонт</option>
    </select>

    <button class="btn btn--primary btn--lg" onclick="generate()" id="genBtn" style="width:100%;justify-content:center">
      ✨ Сгенерировать
    </button>

    <div class="loader-gen" id="genLoader">
      <span class="spinner-sm"></span>Claude генерирует контент...
    </div>

    <div class="gen-output" id="genOutput"></div>

    <div class="gen-actions" id="genActions" style="display:none">
      <button class="btn btn--primary" onclick="copyOutput()">📋 Скопировать</button>
      <button class="btn btn--ghost" onclick="downloadOutput()">⬇️ Скачать .txt</button>
      <button class="btn btn--ghost" onclick="clearOutput()">↺ Сгенерировать заново</button>
    </div>

    <p style="font-size:13px;color:var(--ink-soft);margin-top:16px;text-align:center">
      Контент генерируется на основе реальных данных Синга Сервис. Проверяйте цены перед публикацией.
    </p>
  </div>
</div></section>

<script>
function setPreset(val) { document.getElementById('genDevice').value = val; }

const PROMPTS = {
  repair_page: (device) => `Напиши SEO-оптимизированный контент для страницы ремонта ${device} в Ростове-на-Дону для сервисного центра "Синга Сервис".

Включи:
1. Вводный абзац (150-200 слов) с ключевыми словами "ремонт ${device} Ростов-на-Дону", "цена", "гарантия"
2. Таблицу цен (5-7 видов работ с ценами)
3. Раздел "Частые неисправности" (4-5 пунктов)
4. Раздел "Почему нам доверяют" (3 пункта)
5. Заключительный абзац с призывом к действию

Стиль: профессиональный, но дружелюбный. Цены реалистичные для Ростова-на-Дону.
Упоминай: бесплатная диагностика при ремонте, 8 точек приёма, гарантия, цена до начала работ.`,

  faq: (device) => `Создай FAQ раздел из 5 вопросов и ответов для страницы ремонта ${device} в Ростове-на-Дону (Синга Сервис).

Включи вопросы о:
- Стоимости ремонта (конкретные цифры)
- Сроках
- Гарантии
- Оригинальных vs совместимых запчастях
- Как сдать технику (8 точек, Ozon)

Ответы короткие, информативные, 2-4 предложения.`,

  blog_post: (device) => `Напиши SEO-статью для блога: "Как ухаживать за ${device}: советы мастеров Синга Сервис"

Структура:
- Вводный абзац
- 4-5 советов по уходу
- Раздел "Когда нужен ремонт"
- Заключение с CTA

Длина: 400-600 слов. Тон: экспертный, полезный.`,

  meta: (device) => `Создай SEO-метаданные для страницы "Ремонт ${device} в Ростове-на-Дону":

1. Title (до 60 символов)
2. Description (до 160 символов)  
3. H1 заголовок
4. 5 LSI ключевых слов

Формат: четко разделённые блоки.`,

  prices: (device) => `Создай таблицу цен на ремонт ${device} для Ростова-на-Дону (Синга Сервис):

10-12 видов работ с:
- Названием работы
- Ориентировочной ценой в ₽ (реалистичной)
- Ориентировочным сроком

Формат: | Работа | Цена | Срок |`
};

async function generate() {
  const device = document.getElementById('genDevice').value.trim();
  const type = document.getElementById('genType').value;
  if (!device) { alert('Введите название устройства'); return; }

  document.getElementById('genBtn').disabled = true;
  document.getElementById('genLoader').style.display = 'block';
  document.getElementById('genOutput').style.display = 'none';
  document.getElementById('genActions').style.display = 'none';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        messages: [{role: 'user', content: PROMPTS[type](device)}]
      })
    });

    const data = await response.json();
    const text = data.content?.[0]?.text || 'Ошибка генерации';

    document.getElementById('genLoader').style.display = 'none';
    document.getElementById('genOutput').style.display = 'block';
    document.getElementById('genOutput').textContent = text;
    document.getElementById('genActions').style.display = 'flex';

  } catch(e) {
    document.getElementById('genLoader').style.display = 'none';
    document.getElementById('genOutput').style.display = 'block';
    document.getElementById('genOutput').textContent = 'Ошибка: ' + e.message;
  }

  document.getElementById('genBtn').disabled = false;
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('genOutput').textContent)
    .then(() => alert('Скопировано!'));
}

function downloadOutput() {
  const text = document.getElementById('genOutput').textContent;
  const device = document.getElementById('genDevice').value.replace(/\s+/g,'-').toLowerCase();
  const a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
  a.download = `seo-${device}.txt`;
  a.click();
}

function clearOutput() {
  document.getElementById('genOutput').style.display = 'none';
  document.getElementById('genActions').style.display = 'none';
}
</script>
<script src="assets/search-index.js" defer></script>
<script src="assets/site-search.js" defer></script>
<script>
(function(){
  var path = (location.pathname.split('/').pop() || 'index.html');
  document.querySelectorAll('.menu a').forEach(function(a){
    var href = (a.getAttribute('href')||'').split('#')[0] || 'index.html';
    if(href === path && href !== 'index.html'){ a.classList.add('is-current'); a.setAttribute('aria-current','page'); }
  });
})();
</script>
<script>
(function(){
  var bar = document.getElementById('scrollProgress');
  if(!bar) return;
  function update(){
    var h = document.documentElement;
    var scrollable = h.scrollHeight - h.clientHeight;
    var pct = scrollable > 0 ? (h.scrollTop / scrollable) * 100 : 0;
    bar.style.width = pct + '%';
  }
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  update();
})();
</script>
</body>
</html>
