  document.getElementById('horoBox').innerHTML=`<div style="background:linear-gradient(135deg,#1a1040,#2a1a60);border-radius:20px;padding:28px;text-align:center;color:#fff"><div style="font-size:48px;margin-bottom:12px">${icons[type]}✨</div><p style="font-size:17px;line-height:1.7;margin-bottom:20px">${text}</p><a class="btn btn--primary" href="zapis.html">Записаться на уход</a></div>`;
}
