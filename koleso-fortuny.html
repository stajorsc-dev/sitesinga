<script>
const PRIZES=[
  {t:'Скидка 5%',c:'#1a5eff',code:'SINGA5',icon:'💙'},
  {t:'Скидка 10%',c:'#00b894',code:'SINGA10',icon:'💚'},
  {t:'Диагностика 0₽',c:'#f59e0b',code:'FREEDIAG',icon:'🔍'},
  {t:'Скидка 7%',c:'#6c3fff',code:'SINGA7',icon:'💜'},
  {t:'Скидка 15%',c:'#ef4444',code:'SINGA15',icon:'🔥'},
  {t:'Пленка в подарок',c:'#0ea5e9',code:'FILMGIFT',icon:'🎁'},
  {t:'Скидка 5%',c:'#1a5eff',code:'SINGA5',icon:'💙'},
  {t:'Скидка 10%',c:'#00b894',code:'SINGA10',icon:'💚'},
];
const N=PRIZES.length, seg=360/N;
const wheel=document.getElementById('wheel');
let svg='';
PRIZES.forEach((p,i)=>{
  const a0=(i*seg-90)*Math.PI/180, a1=((i+1)*seg-90)*Math.PI/180;
  const x0=100+95*Math.cos(a0), y0=100+95*Math.sin(a0);
  const x1=100+95*Math.cos(a1), y1=100+95*Math.sin(a1);
  svg+=`<path d="M100,100 L${x0},${y0} A95,95 0 0,1 ${x1},${y1} Z" fill="${p.c}" opacity="${i%2?.85:1}"/>`;
  const am=((i+.5)*seg-90)*Math.PI/180;
  const tx=100+62*Math.cos(am), ty=100+62*Math.sin(am);
  svg+=`<text x="${tx}" y="${ty}" fill="#fff" font-size="9" font-weight="700" text-anchor="middle" transform="rotate(${(i+.5)*seg},${tx},${ty})">${p.t}</text>`;
});
wheel.innerHTML=svg;

let spun=false, rot=0;
function spin(){
  if(spun){return;}
  if(localStorage.getItem('wheelSpun')===new Date().toDateString()){
    alert('Вы уже крутили сегодня! Возвращайтесь завтра 😊');return;
  }
  spun=true;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('spinBtn').textContent='Крутится...';
  // Взвешенный выбор: чаще 5-10%, реже 15%
  const weights=[25,22,12,15,5,8,25,22];
  let total=weights.reduce((a,b)=>a+b),r=Math.random()*total,idx=0;
  for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0){idx=i;break;}}
  const target=360*5 + (360-(idx*seg+seg/2));
  rot+=target;
  wheel.style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{
    const p=PRIZES[idx];
    document.getElementById('prizeIcon').textContent=p.icon;
    document.getElementById('prizeText').textContent=p.t+'!';
    document.getElementById('promoCode').textContent=p.code;
    document.getElementById('wheelResult').style.display='block';
    document.getElementById('spinBtn').style.display='none';
    localStorage.setItem('wheelSpun',new Date().toDateString());
  },4700);
}
function copyPromo(){
  navigator.clipboard.writeText(document.getElementById('promoCode').textContent).then(()=>{
    const el=document.getElementById('promoCode');const o=el.textContent;el.textContent='✓ Скопировано!';setTimeout(()=>el.textContent=o,1200);
  });
}
</script>
