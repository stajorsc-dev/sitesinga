<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <rect width="400" height="260" rx="16" fill="#F0FFF4"/>
  <!-- Laptop before (overheating/dirty) -->
  <rect x="25" y="35" width="150" height="100" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="33" y="43" width="134" height="84" rx="5" fill="#111827"/>
  <!-- Screen content — error -->
  <rect x="36" y="46" width="128" height="78" rx="3" fill="#0F172A"/>
  <text x="100" y="78" font-family="Arial" font-size="11" fill="#EF4444" text-anchor="middle">⚠ CPU 98°C</text>
  <text x="100" y="94" font-family="Arial" font-size="9" fill="#6B7280" text-anchor="middle">Перегрев! Завершение...</text>
  <!-- Dust particles -->
  <circle cx="55" cy="130" r="2" fill="#9CA3AF" opacity=".6"/>
  <circle cx="65" cy="128" r="1.5" fill="#9CA3AF" opacity=".5"/>
  <circle cx="75" cy="132" r="2" fill="#9CA3AF" opacity=".7"/>
  <circle cx="130" cy="129" r="2" fill="#9CA3AF" opacity=".6"/>
  <circle cx="145" cy="127" r="1.5" fill="#9CA3AF" opacity=".5"/>
  <!-- Hot waves -->
  <path d="M85 136 Q90 128 95 136 Q100 128 105 136" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".7"/>
  <!-- Keyboard -->
  <rect x="25" y="135" width="150" height="60" rx="0 0 8 8" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="35" y="148" width="130" height="34" rx="4" fill="#E5E7EB"/>
  <!-- Badge -->
  <rect x="25" y="205" width="150" height="28" rx="8" fill="#EF4444"/>
  <text x="100" y="224" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Перегрев / пыль</text>

  <!-- Arrow -->
  <path d="M188 120 L212 120" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <path d="M203 111 L218 120 L203 129" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Laptop after (clean) -->
  <rect x="225" y="35" width="150" height="100" rx="8" fill="#E5E7EB" stroke="#5b4af0" stroke-width="2"/>
  <rect x="233" y="43" width="134" height="84" rx="5" fill="#111827"/>
  <rect x="236" y="46" width="128" height="78" rx="3" fill="#0F172A"/>
  <!-- Good screen — low temp -->
  <rect x="240" y="50" width="60" height="5" rx="2" fill="#5b4af0" opacity=".5"/>
  <text x="300" y="78" font-family="Arial" font-size="11" fill="#10B981" text-anchor="middle">✓ CPU 42°C</text>
  <text x="300" y="92" font-family="Arial" font-size="9" fill="#6B7280" text-anchor="middle">Температура в норме</text>
  <!-- Fan clean indicator -->
  <circle cx="360" cy="60" r="14" fill="#10B981" opacity=".9"/>
  <path d="M355 60 L358 63 L365 56" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Keyboard -->
  <rect x="225" y="135" width="150" height="60" rx="0 0 8 8" fill="#D1D5DB" stroke="#5b4af0" stroke-width="2"/>
  <rect x="235" y="148" width="130" height="34" rx="4" fill="#E5E7EB"/>
  <!-- Key rows -->
  <rect x="239" y="152" width="8" height="6" rx="1.5" fill="white" opacity=".8"/>
  <rect x="250" y="152" width="8" height="6" rx="1.5" fill="white" opacity=".8"/>
  <rect x="261" y="152" width="8" height="6" rx="1.5" fill="white" opacity=".8"/>
  <rect x="272" y="152" width="8" height="6" rx="1.5" fill="white" opacity=".8"/>
  <!-- Badge -->
  <rect x="225" y="205" width="150" height="28" rx="8" fill="#10B981"/>
  <text x="300" y="224" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Работает тихо и быстро</text>
</svg>
