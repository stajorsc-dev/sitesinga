<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" fill="none">
  <rect width="240" height="280" rx="20" fill="#EBF1FF"/>
  <!-- Background decoration -->
  <circle cx="200" cy="40" r="60" fill="#D4E4FF" opacity=".5"/>
  <circle cx="30" cy="240" r="50" fill="#C8DBFF" opacity=".4"/>
  <!-- Body -->
  <rect x="60" y="180" width="120" height="100" rx="16" fill="#1A5EFF"/>
  <!-- Collar/shirt -->
  <path d="M100 180 L120 200 L140 180" fill="#1040C8"/>
  <!-- Logo badge on shirt -->
  <rect x="108" y="210" width="24" height="16" rx="4" fill="white" opacity=".25"/>
  <!-- Head -->
  <ellipse cx="120" cy="130" rx="48" ry="52" fill="#FDDCB5"/>
  <!-- Hair -->
  <path d="M72 118 Q75 80 120 75 Q165 80 168 118 Q158 95 120 92 Q82 95 72 118Z" fill="#3D2B1A"/>
  <!-- Ears -->
  <ellipse cx="73" cy="132" rx="8" ry="10" fill="#FDDCB5"/>
  <ellipse cx="167" cy="132" rx="8" ry="10" fill="#FDDCB5"/>
  <!-- Eyes -->
  <ellipse cx="105" cy="132" rx="7" ry="8" fill="white"/>
  <ellipse cx="135" cy="132" rx="7" ry="8" fill="white"/>
  <circle cx="107" cy="133" r="4.5" fill="#2C1810"/>
  <circle cx="137" cy="133" r="4.5" fill="#2C1810"/>
  <circle cx="108.5" cy="131.5" r="1.5" fill="white"/>
  <circle cx="138.5" cy="131.5" r="1.5" fill="white"/>
  <!-- Eyebrows -->
  <path d="M97 122 Q105 118 113 121" stroke="#3D2B1A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M127 121 Q135 118 143 122" stroke="#3D2B1A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M108 148 Q120 160 132 148" stroke="#C17B5A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Tool in hand -->
  <rect x="150" y="200" width="8" height="40" rx="3" fill="#FDDCB5"/>
  <rect x="154" y="195" width="14" height="10" rx="3" fill="#666" transform="rotate(-15 154 195)"/>
</svg>
