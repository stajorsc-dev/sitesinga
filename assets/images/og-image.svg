<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07152e"/>
      <stop offset="100%" style="stop-color:#102260"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5eff"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow circles -->
  <circle cx="900" cy="150" r="280" fill="rgba(26,94,255,.12)"/>
  <circle cx="200" cy="500" r="200" fill="rgba(0,184,148,.08)"/>
  <!-- Logo mark -->
  <rect x="80" y="80" width="64" height="64" rx="16" fill="#1a5eff"/>
  <path d="M104 100 L92 120h8l-4 16 16-24h-8z" fill="white"/>
  <!-- Company name -->
  <text x="160" y="106" font-family="Arial,sans-serif" font-size="32" font-weight="900" fill="white">Синга</text>
  <text x="160" y="140" font-family="Arial,sans-serif" font-size="32" font-weight="900" fill="#1a5eff"> Сервис</text>
  <!-- Main headline -->
  <text x="80" y="250" font-family="Arial,sans-serif" font-size="72" font-weight="900" fill="white">Чиним всё.</text>
  <text x="80" y="340" font-family="Arial,sans-serif" font-size="60" font-weight="900">
    <tspan fill="url(#accent)">Быстро. Честно. С гарантией.</tspan>
  </text>
  <!-- Subline -->
  <text x="80" y="410" font-family="Arial,sans-serif" font-size="28" fill="rgba(255,255,255,.65)">Телефоны · Ноутбуки · ТВ · Кофемашины · Dyson</text>
  <!-- Stats row -->
  <rect x="80" y="460" width="200" height="80" rx="16" fill="rgba(255,255,255,.08)"/>
  <text x="180" y="492" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">8</text>
  <text x="180" y="524" font-family="Arial,sans-serif" font-size="16" fill="rgba(255,255,255,.5)" text-anchor="middle">точек приёма</text>
  <rect x="300" y="460" width="200" height="80" rx="16" fill="rgba(255,255,255,.08)"/>
  <text x="400" y="492" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">0 ₽</text>
  <text x="400" y="524" font-family="Arial,sans-serif" font-size="16" fill="rgba(255,255,255,.5)" text-anchor="middle">диагностика</text>
  <rect x="520" y="460" width="200" height="80" rx="16" fill="rgba(255,255,255,.08)"/>
  <text x="620" y="492" font-family="Arial,sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">4.9★</text>
  <text x="620" y="524" font-family="Arial,sans-serif" font-size="16" fill="rgba(255,255,255,.5)" text-anchor="middle">рейтинг</text>
  <!-- Phone -->
  <text x="1120" y="590" font-family="Arial,sans-serif" font-size="22" fill="rgba(255,255,255,.5)" text-anchor="end">8 928 161-87-89 · Ростов-на-Дону</text>
</svg>
