<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <rect width="400" height="260" rx="16" fill="#FFF0F5"/>
  <!-- Dyson before (weak suction / dead battery) -->
  <!-- Handle -->
  <rect x="65" y="20" width="18" height="120" rx="9" fill="#8B5CF6"/>
  <!-- Body/barrel -->
  <ellipse cx="74" cy="145" rx="35" ry="25" fill="#7C3AED"/>
  <!-- Filter area -->
  <ellipse cx="74" cy="130" rx="20" ry="14" fill="#6D28D9"/>
  <!-- Suction head -->
  <rect x="40" y="168" width="70" height="16" rx="8" fill="#5B21B6"/>
  <!-- Battery indicator — empty/red -->
  <rect x="90" y="40" width="40" height="18" rx="5" fill="#1F2937" stroke="#374151" stroke-width="1.5"/>
  <rect x="130" y="46" width="4" height="6" rx="1" fill="#374151"/>
  <rect x="93" y="43" width="8" height="12" rx="2" fill="#EF4444"/>
  <text x="110" y="100" font-family="Arial" font-size="9" fill="#EF4444" text-anchor="middle">Разряжен</text>
  <!-- Weak suction arrows (small) -->
  <path d="M25 176 L10 176" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
  <path d="M10 176 L15 172 M10 176 L15 180" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Badge -->
  <rect x="20" y="210" width="140" height="28" rx="8" fill="#EF4444"/>
  <text x="90" y="229" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Не держит заряд</text>

  <!-- Arrow -->
  <path d="M175 130 L225 130" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  <path d="M215 121 L230 130 L215 139" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Dyson after (full power) -->
  <rect x="265" y="20" width="18" height="120" rx="9" fill="#8B5CF6"/>
  <ellipse cx="274" cy="145" rx="35" ry="25" fill="#7C3AED"/>
  <ellipse cx="274" cy="130" rx="20" ry="14" fill="#6D28D9"/>
  <rect x="240" y="168" width="70" height="16" rx="8" fill="#5B21B6"/>
  <!-- Battery indicator — full/green -->
  <rect x="290" y="40" width="40" height="18" rx="5" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
  <rect x="330" y="46" width="4" height="6" rx="1" fill="#10B981"/>
  <rect x="293" y="43" width="32" height="12" rx="2" fill="#10B981" opacity=".9"/>
  <text x="310" y="100" font-family="Arial" font-size="9" fill="#10B981" text-anchor="middle">Заряжен</text>
  <!-- Strong suction vortex -->
  <path d="M225 175 Q215 172 210 176 Q215 180 225 177" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" fill="rgba(139,92,246,.15)"/>
  <path d="M220 172 Q208 169 204 176 Q208 183 220 180" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".7"/>
  <!-- Badge -->
  <rect x="220" y="210" width="140" height="28" rx="8" fill="#10B981"/>
  <text x="290" y="229" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Мощность восстановлена</text>
</svg>
