<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <rect width="400" height="260" rx="16" fill="#F5F3FF"/>
  <!-- Printer before (jammed) -->
  <rect x="30" y="60" width="140" height="90" rx="10" fill="#374151" stroke="#6B7280" stroke-width="2"/>
  <rect x="42" y="72" width="116" height="44" rx="6" fill="#1F2937"/>
  <!-- Status light red -->
  <circle cx="155" cy="140" r="7" fill="#EF4444"/>
  <circle cx="155" cy="140" r="4" fill="#FF6B6B"/>
  <!-- Jammed paper -->
  <rect x="40" y="110" width="120" height="8" rx="2" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <path d="M100 110 L110 118 L90 115Z" fill="#F59E0B" opacity=".7"/>
  <!-- Output tray -->
  <rect x="30" y="150" width="140" height="30" rx="0 0 10 10" fill="#4B5563"/>
  <!-- Crumpled paper in tray -->
  <path d="M50 155 Q80 150 110 158 Q130 162 150 155" stroke="#FEF3C7" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Error indicator on screen -->
  <text x="100" y="98" font-family="Arial" font-size="10" fill="#EF4444" text-anchor="middle">PAPER JAM</text>
  <!-- Badge -->
  <rect x="30" y="192" width="140" height="28" rx="8" fill="#EF4444"/>
  <text x="100" y="211" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Замятие / не печатает</text>

  <!-- Arrow -->
  <path d="M183 120 L217 120" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <path d="M207 111 L222 120 L207 129" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Printer after (working) -->
  <rect x="230" y="60" width="140" height="90" rx="10" fill="#374151" stroke="#1A5EFF" stroke-width="2"/>
  <rect x="242" y="72" width="116" height="44" rx="6" fill="#1F2937"/>
  <!-- Status light green -->
  <circle cx="355" cy="140" r="7" fill="#10B981"/>
  <circle cx="355" cy="140" r="4" fill="#34D399"/>
  <!-- Perfect paper output -->
  <rect x="240" y="150" width="140" height="30" rx="0 0 10 10" fill="#4B5563"/>
  <!-- Clean printed pages -->
  <rect x="255" y="148" width="110" height="2" rx="1" fill="white" opacity=".9"/>
  <rect x="258" y="152" width="104" height="1.5" rx="1" fill="rgba(255,255,255,.5)"/>
  <rect x="261" y="155" width="98" height="1.5" rx="1" fill="rgba(255,255,255,.35)"/>
  <!-- Screen shows OK -->
  <text x="300" y="96" font-family="Arial" font-size="10" fill="#10B981" text-anchor="middle">Ready ✓</text>
  <rect x="255" y="100" width="90" height="8" rx="2" fill="rgba(16,185,129,.2)"/>
  <!-- Badge -->
  <rect x="230" y="192" width="140" height="28" rx="8" fill="#10B981"/>
  <text x="300" y="211" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Печатает чётко</text>
</svg>
