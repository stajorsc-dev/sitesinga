<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <rect width="400" height="260" rx="16" fill="#FFF8E6"/>
  <!-- TV before (dark/black screen) -->
  <rect x="20" y="20" width="160" height="110" rx="10" fill="#1A1A2E" stroke="#334" stroke-width="2"/>
  <rect x="30" y="30" width="140" height="90" rx="6" fill="#050510"/>
  <!-- Dark screen — no backlight -->
  <rect x="33" y="33" width="134" height="84" rx="4" fill="#0A0A1A"/>
  <text x="100" y="82" font-family="Arial" font-size="11" fill="rgba(255,255,255,.2)" text-anchor="middle">Нет изображения</text>
  <!-- TV stand -->
  <rect x="85" y="130" width="30" height="14" rx="3" fill="#444"/>
  <rect x="70" y="144" width="60" height="6" rx="3" fill="#555"/>
  <!-- Badge БЫЛО -->
  <rect x="20" y="155" width="160" height="28" rx="8" fill="#EF4444"/>
  <text x="100" y="174" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">БЫЛО — чёрный экран</text>

  <!-- Arrow -->
  <path d="M193 95 L207 95" stroke="#E67E22" stroke-width="3" stroke-linecap="round"/>
  <path d="M203 86 L213 95 L203 104" stroke="#E67E22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- TV after (bright screen) -->
  <rect x="220" y="20" width="160" height="110" rx="10" fill="#1A1A2E" stroke="#F59E0B" stroke-width="2"/>
  <rect x="230" y="30" width="140" height="90" rx="6" fill="#0F172A"/>
  <!-- Glowing screen -->
  <rect x="233" y="33" width="134" height="84" rx="4" fill="#1E3A5F"/>
  <!-- Screen content -->
  <rect x="236" y="36" width="128" height="50" rx="3" fill="#1A5EFF" opacity=".3"/>
  <rect x="246" y="48" width="60" height="5" rx="2" fill="white" opacity=".8"/>
  <rect x="246" y="58" width="80" height="3" rx="2" fill="white" opacity=".4"/>
  <rect x="236" y="93" width="128" height="20" rx="3" fill="#0F172A" opacity=".5"/>
  <rect x="242" y="97" width="35" height="8" rx="2" fill="#3B82F6" opacity=".7"/>
  <rect x="284" y="97" width="35" height="8" rx="2" fill="#475569" opacity=".6"/>
  <!-- Backlight glow effect -->
  <rect x="230" y="30" width="140" height="90" rx="6" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity=".5"/>
  <ellipse cx="300" cy="75" rx="50" ry="35" fill="rgba(245,158,11,.08)"/>
  <!-- TV stand -->
  <rect x="285" y="130" width="30" height="14" rx="3" fill="#444"/>
  <rect x="270" y="144" width="60" height="6" rx="3" fill="#555"/>
  <!-- Badge СТАЛО -->
  <rect x="220" y="155" width="160" height="28" rx="8" fill="#10B981"/>
  <text x="300" y="174" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">СТАЛО — яркий экран</text>
</svg>
