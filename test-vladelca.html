<script>
const Q=[
  {q:'Твой телефон сейчас:',a:[['В идеале, как новый',0],['Пара царапин, но ок',1],['Треснут, но работает',2],['Держится на скотче',3]]},
  {q:'Защитное стекло на телефоне?',a:[['Конечно, и чехол',0],['Стекло есть',1],['Было когда-то',2],['А зачем?',3]]},

  {q:'Телефон упал в воду. Ты:',a:[['Достану из чехла, всё сухо',0],['Быстро высушу',1],['Положу в рис',2],['Куплю новый',3]]},
];
const RESULTS=[
  {t:'🛡 Хранитель',d:'Ты бережёшь технику как зеницу ока. Чехол, стекло, бэкапы — всё под контролем. Таким клиентам мы даём максимальную гарантию, ведь устройство в идеале!'},
  {t:'😎 Реалист',d:'Ты пользуешься техникой по назначению и не паришься по мелочам. Разумный подход! Когда что-то ломается — просто приносишь к нам.'},
  {t:'🤙 Экстремал',d:'Твой телефон прошёл огонь и воду. Трещины — это характер! Мы любим такие вызовы и вернём твою технику к жизни.'},
  {t:'🔥 Камикадзе',d:'Твоя техника живёт на грани. Скотч — это стиль жизни. Тебе точно нужен наш абонемент — будем спасать регулярно со скидкой!'},
];
let score=0,step=0;
function render(){
  if(step<Q.length){
    document.getElementById('fqBox').innerHTML=`<div style="height:6px;background:#f0f5ff;border-radius:99px;margin-bottom:20px"><div style="height:100%;width:${step/Q.length*100}%;background:#5b4af0;border-radius:99px;transition:.3s"></div></div><p style="font-size:18px;font-weight:700;margin-bottom:16px">${Q[step].q}</p><div style="display:flex;flex-direction:column;gap:10px">${Q[step].a.map(o=>`<button class="btn btn--ghost btn--lg" style="justify-content:flex-start" onclick="answer(${o[1]})">${o[0]}</button>`).join('')}</div>`;
  }else{
    const idx=Math.min(3,Math.round(score/step));
    const r=RESULTS[idx];
    const code=['CARE5','REAL7','EXTREME10','SAVE15'][idx];
    document.getElementById('fqBox').innerHTML=`<div style="text-align:center"><div style="font-size:56px;margin-bottom:8px">${r.t.split(' ')[0]}</div><h2 style="font-size:24px;font-weight:900;font-family:Onest,sans-serif;margin-bottom:10px">${r.t.split(' ').slice(1).join(' ')}</h2><p style="font-size:15px;line-height:1.7;color:var(--ink-soft);margin-bottom:16px">${r.d}</p><div style="background:#f0f5ff;border-radius:12px;padding:14px;margin-bottom:16px"><span style="font-size:12px;color:#8a9bb5">Твой промокод:</span><div style="font-family:monospace;font-size:20px;font-weight:800;color:#5b4af0">${code}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><a class="btn btn--primary" href="zapis.html">Записаться</a><button class="btn btn--ghost" onclick="restart()">Пройти заново</button></div></div>`;
  }
}
function answer(pts){score+=pts;step++;render();}
function restart(){score=0;step=0;render();}
render();
</script>
