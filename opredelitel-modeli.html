<script>
const FLOW={
  start:{q:'Какой бренд телефона?',opts:[['Apple iPhone','apple'],['Samsung','samsung'],['Xiaomi/Redmi','xiaomi'],['Другой','other']]},
  apple:{q:'Есть ли кнопка Home (круглая внизу)?',opts:[['Да, есть','apple_home'],['Нет, весь экран','apple_full']]},
  apple_home:{r:'Скорее всего iPhone SE, 8, 7 или раньше. Это модели с Touch ID. Точную модель скажет мастер — цена замены экрана от 2 500 ₽.'},
  apple_full:{q:'Есть вырез «чёлка» или «остров» сверху?',opts:[['Чёлка (вырез)','apple_notch'],['Островок (Dynamic Island)','apple_island']]},
  apple_notch:{r:'Это iPhone X, XR, 11, 12, 13 или 14. Модели с Face ID и чёлкой. Замена экрана от 2 500 до 5 500 ₽ в зависимости от модели.'},
  apple_island:{r:'Это iPhone 14 Pro, 15 или 16 серии — новейшие с Dynamic Island. Замена экрана от 5 500 ₽. Точную модель уточним при осмотре.'},
  samsung:{q:'Складывается ли телефон?',opts:[['Да, складной','sam_fold'],['Нет, обычный','sam_normal']]},
  sam_fold:{r:'Это Galaxy Z Fold или Z Flip. Складные модели — ремонт от 5 000 ₽. Точную модель определит мастер.'},
  sam_normal:{q:'Какого класса телефон?',opts:[['Флагман (дорогой)','sam_s'],['Средний/бюджет','sam_a']]},
  sam_s:{r:'Это Galaxy S серии. Замена экрана от 3 500 ₽. Модель уточним по номеру на корпусе.'},
  sam_a:{r:'Это Galaxy A или M серии. Замена экрана от 1 800 ₽. Запчасти обычно в наличии.'},
  xiaomi:{r:'Xiaomi, Redmi или POCO — большой модельный ряд. Замена экрана от 1 500 ₽. Принесите телефон — определим модель по коду и назовём точную цену.'},
  other:{r:'Honor, Huawei, Realme, OPPO, Vivo и другие — ремонтируем всё. Принесите устройство или напишите модель в Telegram — назовём цену.'}
};
function showStep(key){
  const node=FLOW[key];const box=document.getElementById('detStep');
  if(node.r){
    box.innerHTML=`<div style="text-align:center"><div style="font-size:48px;margin-bottom:12px">✅</div><p style="font-size:16px;line-height:1.7;color:var(--ink);margin-bottom:20px">${node.r}</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><a class="btn btn--primary" href="zapis.html">Записаться на ремонт</a><a class="btn btn--tg" href="https://t.me/+79281618789" target="_blank" rel="noopener"><svg><use href="#i-tg"/></svg> Уточнить</a><button class="btn btn--ghost" onclick="showStep('start')">Заново</button></div></div>`;
    return;
  }
  box.innerHTML=`<p style="font-size:18px;font-weight:700;margin-bottom:16px">${node.q}</p><div style="display:flex;flex-direction:column;gap:10px">${node.opts.map(o=>`<button class="btn btn--ghost btn--lg" style="justify-content:flex-start" onclick="showStep('${o[1]}')">${o[0]}</button>`).join('')}</div>`;
}
showStep('start');
</script>
